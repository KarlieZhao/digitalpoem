<body>
    <header id=nav>

    <script>
        let blocks = [];
        let graphics;
        let letters = "夏夜 濕氣預謀著一場雨 滴滴答答 踢踢踏踏 淅淅瀝瀝 窸窸窣窣 叮叮噹噹 嘩啦嘩啦 乒乒乓乓 大珠小珠 濺濺有聲 雨聲淋漓 風聲簌簌 它們都如張岱所言 回首二十年 恍若隔世  "
        let counter = 0;
        let char;
        let charCount = 0;
        let currentPos = 50;

        function isMobileDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            return (/android/i.test(userAgent) || /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream);
        }

        function setup() {
            createCanvas(600, 900);
            colorMode(HSB, 360, 100, 100, 100);
            graphics = createGraphics(width, height);
            graphics.noStroke();
            for (let i = 0; i < width * height * 3 / 100; i++) {
                let x = random(width);// width/2;//(5*i+random(10))%width;
                let y = random(height);
                let w = random(3);
                let h = random(3);
                let a = random(TWO_PI);
                graphics.fill(random(255), 30);
                graphics.push();
                graphics.translate(x, y);
                graphics.rotate(a);
                graphics.ellipse(0, 0, w, h);
                graphics.pop();
            }
            matter.init();
            platform = matter.makeBarrier(width / 2, height, width, 70);
            // platform2 = matter.makeBarrier(width, height / 2, 100, height);
            // platform3 = matter.makeBarrier(0, height / 2, 100, height);

        }

        function makeNekodearu(x, y, d) {
            charCount++;
            tSize = random(d / 3, d);
            textSize(tSize);
            textFont("serif");
            char = letters.substr(counter++ % letters.length, 1).toUpperCase();
            let b = matter.makeSign(char, x, y, {
                density: 0.01,
            });
            b.textSize = tSize;
            blocks.push(b);
        }

        function draw() {
            clear();

            fill(0);
            noStroke();
            // platform.show();
            // platform2.show();
            // platform3.show();

            if (frameCount % 10 == 0) {
                let d = random(50) + 40;
                let x = random(width - 100) + 50;
                let y = random(-d / 4,  d );
                makeNekodearu(x, y, d);
            }

            for (let i = blocks.length - 1; i >= 0; i--) {
                let b = blocks[i];
                // print(b);
                let p = b.body.position;
                push();
                translate(p.x, p.y, 0);
                rotate(b.body.angle);
                fill(0, 0, 0);
                textAlign(CENTER, CENTER);
                textStyle(BOLD);
                textSize(b.textSize);
                text(b.text, 0, 0);
                pop();
                if (b.isOffCanvas()) {
                    matter.forget(b);
                    blocks.splice(i, 1);
                }
            }
            push();
            let g = get();
            clear();
            background(0, 0, 90);
            image(graphics, 0, 0);
            // drawingContext.shadowColor = color(0, 0, 0, 33);
            // drawingContext.shadowBlur = width / 40;
            // drawingContext.shadowOffsetX = width / 100;
            // drawingContext.shadowOffsetY = width / 50;
            image(g, 0, 0);
            pop();
        }
    </script>
</body>
